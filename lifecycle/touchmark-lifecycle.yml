session_lifecycle:
  - Sessions are opened per scope with session.start (idempotent on scope_id).
  - Sessions lapse server-side after about one week with no emits; consuming the
    valuation stream does not reset the clock. The next emit or end on a lapsed
    session throws session_closed.
  - session.end closes a session early, shedding its long-poll load and freeing
    the scope_id for a fresh session; late re-valuations still arrive on the
    stream after end.
  - The public no-account session page shows the last 24 hours of session
    activity; older events stay in Touchmark's retained log.
