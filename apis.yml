aid: touchmark
name: Touchmark
description: Touchmark is solving AI pricing - instead of AI being priced per
  token regardless of quality, Touchmark prices it by the quality, efficiency,
  and value of the output, so spend is fair, predictable, and tied to what you
  actually get. Applications emit the events they already produce (model
  outputs, tool calls, code diffs) with a base price, and Touchmark's
  out-of-band judge returns a quality-adjusted fair price for each event on a
  separate valuation stream. A Y Combinator Summer 2026 company founded by Ilia
  Bolgov and Roman Yanushevskyi in San Francisco; the TypeScript SDK
  (@touchmark/sdk) is in private beta.
