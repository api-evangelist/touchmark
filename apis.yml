apis:
- name: Touchmark Sessions API
  description: The pricing surface behind @touchmark/sdk - open a session per
    scope, emit events fire-and-forget with an idempotent event_id, and consume
    quality-adjusted valuations (absolute fair_price_usd per event) on a
    cursor-resumable stream. HTTP transport (long-poll in v1) over a
    protobuf/gRPC wire contract (proto/touchmark/v1/session.proto); Bearer
    api_key auth. Private beta - no public OpenAPI is published.
  humanURL: https://docs.touchmark.ai/sdk/overview
